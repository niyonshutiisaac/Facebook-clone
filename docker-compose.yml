# =============================================================================
# facebook-clone — full stack orchestration
# -----------------------------------------------------------------------------
# Services:
#   nginx      : public entrypoint (ports 80 / 443)
#   php-fpm    : Laravel 11 application runtime (PHP 8.3)
#   mysql      : MySQL 8.0 primary (write connection)
#   mysql-repl : MySQL 8.0 read replica (read connection)
#   redis      : cache, queue, session, broadcasting + presence
#   meilisearch: full text search engine (Laravel Scout driver)
#   minio      : S3 compatible object storage for user media
#   soketi     : Pusher compatible WebSocket server for Laravel Echo
#   mailpit    : SMTP catcher for local email verification / password resets
#   node       : Vite dev server for the React frontend (with HMR)
#   horizon    : queue worker supervisor + dashboard
# =============================================================================
name: facebook-clone

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: fb-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./backend/public:/var/www/html/public:ro
      - ./backend/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php-fpm:
        condition: service_started

  php-fpm:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: fb-php-fpm
    restart: unless-stopped
    environment:
      PHP_IDE_CONFIG: serverName=facebook-clone
    volumes:
      - ./backend:/var/www/html
      - ./backend/docker/php.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: fb-mysql
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --server-id=1
      --log-bin=mysql-bin
      --binlog-format=ROW
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-facebook_clone}
      MYSQL_USER: ${DB_USERNAME:-facebook}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/docker/mysql/primary.cnf:/etc/mysql/conf.d/primary.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  mysql-repl:
    image: mysql:8.0
    container_name: fb-mysql-replica
    restart: unless-stopped
    command: >
      --server-id=2
      --relay-log=relay-bin
      --read-only=ON
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-facebook_clone}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - mysql-replica-data:/var/lib/mysql

  redis:
    image: redis:7.4-alpine
    container_name: fb-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: fb-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:-masterKeyChangeMe}
      MEILI_ENV: development
    ports:
      - "${MEILISEARCH_PORT:-7700}:7700"
    volumes:
      - meili-data:/meili_data

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: fb-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-facebook}
      MINIO_ROOT_SECRET: ${AWS_SECRET_ACCESS_KEY:-facebooksecret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  soketi:
    image: quay.io/soketi/soketi:1.6-16-debian
    container_name: fb-soketi
    restart: unless-stopped
    environment:
      SOKETI_DEBUG: "1"
      SOKETI_DEFAULT_APP_ID: ${PUSHER_APP_ID:-facebook}
      SOKETI_DEFAULT_APP_KEY: ${PUSHER_APP_KEY:-facebook-key}
      SOKETI_DEFAULT_APP_SECRET: ${PUSHER_APP_SECRET:-facebook-secret}
      SOKETI_METRICS_ENABLED: "1"
    ports:
      - "${SOCKETI_PORT:-6001}:6001"

  mailpit:
    image: axllent/mailpit:latest
    container_name: fb-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  horizon:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: fb-horizon
    restart: unless-stopped
    command: php artisan horizon
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - redis
      - mysql

  scheduler:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: fb-scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - redis
      - mysql

  node:
    image: node:22-alpine
    container_name: fb-node
    restart: unless-stopped
    working_dir: /app
    environment:
      VITE_API_URL: http://localhost/api
      VITE_BROADCAST_HOST: localhost
      VITE_PUSHER_APP_KEY: ${PUSHER_APP_KEY:-facebook-key}
      VITE_PUSHER_PORT: ${SOCKETI_PORT:-6001}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  mysql-data:
  mysql-replica-data:
  redis-data:
  meili-data:
  minio-data:
